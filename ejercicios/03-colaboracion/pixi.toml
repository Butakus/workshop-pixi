# Ejercicio 3: punto de partida.
#
# Empezamos con nodos de demo de ROS ya construidos. Este ejercicio va de CI y
# despliegue, sin compilar los paquetes del Ejercicio 2.
#
# Tu trabajo:
#   1. Subir el workspace a GitHub y añadir CI con el lockfile.
#   2. Completar el Dockerfile y ejecutar la imagen.
#   3. Empaquetar el entorno, desempaquetarlo y ejecutar los nodos sin Pixi.
#
# Instrucciones: ./README.md

[workspace]
name = "ros-demo-team"
description = "Nodos de demo de ROS 2 para CI y despliegue"
channels = ["https://prefix.dev/robostack-lyrical", "conda-forge"]
platforms = [
  "linux-64",
  "linux-aarch64",
  { platform = "osx-arm64", macos = "14.0" },
  "win-64",
]
version = "0.1.0"

[dependencies]
ros-lyrical-demo-nodes-cpp = ">=0.37.9,<0.38"
ros-lyrical-ros2run = ">=0.40"
ros-lyrical-ros2topic = ">=0.40"

[tasks.talker]
cmd = "ros2 run demo_nodes_cpp talker"
description = "Publica mensajes con el nodo de demo ya construido"

[tasks.listener]
cmd = "ros2 run demo_nodes_cpp listener"
description = "Recibe los mensajes del talker"

[tasks.test]
cmd = "ros2 pkg executables demo_nodes_cpp"
description = "Comprueba que ROS encuentra el paquete de demo y lista sus ejecutables"
