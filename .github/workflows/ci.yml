# Mantiene honestas las soluciones de los ejercicios.
#
# Este workflow también es material del taller: el Ejercicio 3 propone leerlo.
# Adaptado de la CI del taller de prefix.dev (BSD-3-Clause).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Las versiones de los paquetes cambian por debajo. Una ejecución semanal nos
  # avisa antes de que lo descubra un asistente.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La barrera barata: ¿está cada lockfile al día con su manifiesto?
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - name: Lockfile del material
        run: pixi lock --check
      - name: Lockfiles de las soluciones
        run: |
          for solucion in soluciones/0*/; do
            echo "::group::$solucion"
            pixi lock --check --manifest-path "$solucion/pixi.toml"
            echo "::endgroup::"
          done

  # La comprobación de verdad: cada solución se instala y funciona en cada SO.
  soluciones:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        solucion: [01-workspace-ros, 02-paquetes-ros, 03-colaboracion]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Windows limita las rutas a 260 caracteres; los builds desde código
      # fuente anidan lo bastante como para pasarse. Entornos en una ruta corta.
      - name: Rutas cortas en Windows
        if: runner.os == 'Windows' && matrix.solucion != '03-colaboracion'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.pixi" | Out-Null
          Add-Content "$env:USERPROFILE\.pixi\config.toml" "detached-environments = 'C:\pix'"
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: soluciones/${{ matrix.solucion }}/pixi.toml
          locked: true
      - name: Smoke test
        run: pixi run --manifest-path soluciones/${{ matrix.solucion }}/pixi.toml test

  # Compila los dos overlays y vuelve al primero: detecta rutas compartidas y
  # underlays encadenados entre distros.
  dos-distros:
    needs: lockfiles
    runs-on: ubuntu-latest
    env:
      MANIFEST: soluciones/01-workspace-ros/pixi.toml
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: ${{ env.MANIFEST }}
          environments: default jazzy
          locked: true
      - name: Lyrical
        run: |
          pixi run --manifest-path $MANIFEST -e default build
          pixi run --manifest-path $MANIFEST -e default test-overlay
      - name: Jazzy
        run: |
          pixi run --manifest-path $MANIFEST -e jazzy build
          pixi run --manifest-path $MANIFEST -e jazzy test-overlay
      - name: Vuelta a Lyrical
        run: |
          pixi run --manifest-path $MANIFEST -e default build
          pixi run --manifest-path $MANIFEST -e default test-overlay

  # Publicar y consumir: lo que sustituye a la buildfarm.
  publicar-y-consumir:
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: soluciones/02-paquetes-ros/pixi.toml
          locked: true
      - name: Publicar en un canal local
        working-directory: soluciones/02-paquetes-ros
        run: pixi publish --target-channel output
      - name: Instalar desde el canal, sin código fuente
        working-directory: soluciones/02-paquetes-ros/consumidor
        run: pixi run ros2 pkg executables turtle_dancer

  # Un workspace real: clonar con vcstool, compilar con colcon y encontrar el overlay.
  workspace-real:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MANIFEST: soluciones/04-workspace-real/pixi.toml
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: ${{ env.MANIFEST }}
          locked: true
      - name: Clonar y compilar
        run: pixi run --manifest-path $MANIFEST build
      - name: El overlay se carga
        run: pixi run --manifest-path $MANIFEST test

  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true
      - run: pixi run slides
